{% extends "base.html" %}
{% block title %}Статистика — HomeStock{% endblock %}
{% block content %}
    <h1>Статистика по категориям</h1>
    <ul class="list-group mt-4">
        {% for item in stats %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ item.category_name }}
                <span class="badge bg-primary rounded-pill">{{ item.stock_count }}</span>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
